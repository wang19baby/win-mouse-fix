[package]
name = "win-mouse-fix"
version = "0.1.0"
edition = "2021"
description = "Windows mouse enhancement tool (smooth scroll, button remapping) — Rust + native Win32"
license = "MIT"

[dependencies]
# Pinned to versions already present in the local cargo cache (rsproxy.cn mirror).
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Registry",

    "Win32_NetworkManagement_IpHelper",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
parking_lot = "0.12"
qrcode = "0.14.1"
serde_json = "1.0.151"
tungstenite = { version = "0.18.0", features = ["url"] }
url = "2.5.8"
http = "1.5.0"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
[profile.release]
opt-level = 3
lto = true
panic = "abort"

[[bin]]
name = "dpi-probe"
path = "src/bin/dpi-probe.rs"
