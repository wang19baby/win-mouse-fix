[package]
name = "win-mouse-fix"
version = "0.1.0"
edition = "2021"
description = "Windows mouse enhancement tool (smooth scroll, button remapping) — Rust + native Win32"
license = "MIT"

[dependencies]
# Pinned to versions already present in the local cargo cache (rsproxy.cn mirror).
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
