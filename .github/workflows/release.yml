name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: build and upload
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-latest

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/win-mouse-fix.exe -DestinationPath win-mouse-fix.zip -Force
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          Write-Host "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: win-mouse-fix.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
