<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="/manifest.json">
<title>妙控板</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;width:100%;overflow:hidden;background:#0a0a0a;touch-action:none;overscroll-behavior:none;}
  #pad{position:fixed;inset:0;touch-action:none;background:radial-gradient(circle at 50% 38%,#1b1b1b,#0a0a0a);}
  #hud{position:fixed;top:env(safe-area-inset-top,8px);left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;color:#8a8a8a;font:13px/1.2 system-ui,-apple-system,sans-serif;pointer-events:none;padding:6px 12px;}
  #status{letter-spacing:.3px;}
  #batteries{display:flex;gap:8px;font-size:12px;color:#6a6a6a;}
  .bat{display:flex;align-items:center;gap:3px;}
  .bat-icon{width:18px;height:10px;border:1px solid #555;border-radius:2px;position:relative;padding:1px;}
  .bat-icon::after{content:'';position:absolute;right:-4px;top:2px;width:3px;height:4px;background:#555;border-radius:0 1px 1px 0;}
  .bat-fill{height:100%;border-radius:1px;transition:width .3s;}
  .bat-pct{font-size:11px;}
  #fingers{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:50%;transform:translateX(-50%);color:#5f5f5f;font:12px/1 system-ui;pointer-events:none;opacity:.85;}
  .ripple{position:fixed;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.45);transform:translate(-50%,-50%);pointer-events:none;animation:rip .35s ease-out forwards;}

  @keyframes rip{from{opacity:.6;transform:translate(-50%,-50%) scale(.4);}to{opacity:0;transform:translate(-50%,-50%) scale(1.7);}}
  #banner{position:fixed;top:calc(env(safe-area-inset-top,0px) + 46px);left:50%;transform:translateX(-50%);
    display:none;align-items:center;gap:9px;background:rgba(190,45,45,.94);color:#fff;
    font:14px/1.3 system-ui;padding:9px 16px;border-radius:20px;z-index:20;max-width:92%;text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,.45);}
  #banner.show{display:flex;}
  #banner .dot{width:9px;height:9px;border-radius:50%;background:#fff;animation:blink 1s infinite;}
  @keyframes blink{0%,100%{opacity:.35;}50%{opacity:1;}}
  #inputBar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:6px;align-items:center;padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px);background:rgba(18,18,18,.95);border-top:1px solid #333;z-index:15;}
  #inputBar.hidden{display:none;}
  #textField{width:100%;background:#1a1a1a;color:#eee;border:1px solid #444;border-radius:8px;padding:8px 10px;font:15px/1.3 system-ui;outline:none;resize:none;height:36px;max-height:96px;-webkit-user-select:text;user-select:text;}
  #textField:focus{border-color:#6a6;}
  .tf-wrap{position:relative;flex:1 1 0;min-width:0;}
  #charCount{position:absolute;right:10px;bottom:8px;color:#8a8;font:11px system-ui;white-space:nowrap;pointer-events:none;}
  #collapseBtn{background:none;color:#8a8;border:1px solid #555;border-radius:6px;width:32px;height:36px;font:16px system-ui;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  #collapseBtn:active{color:#fff;border-color:#888;}
  #sendBtn{background:#3a7;color:#fff;border:none;border-radius:8px;padding:0 14px;font:13px system-ui;font-weight:600;cursor:pointer;white-space:nowrap;height:36px;flex-shrink:0;}
  #sendBtn:active{background:#2a6;}
  #inputToggle{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);right:58px;background:#3a7;color:#fff;border:1px solid #2a6;border-radius:50%;width:44px;height:44px;font:20px system-ui;z-index:20;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  #winListToggle{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;background:#356;border:1px solid #2a5;border-radius:50%;width:44px;height:44px;font:20px system-ui;color:#fff;z-index:20;display:flex;align-items:center;justify-content:center;cursor:pointer;}

  @media (orientation:landscape){
    #inputBar{padding:4px 8px calc(env(safe-area-inset-bottom,0px) + 4px);gap:4px;}
    #textField{height:30px;font-size:13px;padding:5px 8px;}
    #sendBtn{height:30px;padding:0 10px;font-size:12px;}
    #collapseBtn{width:28px;height:30px;font-size:14px;}
    #charCount{right:8px;bottom:5px;font-size:10px;}
    #inputToggle{width:38px;height:38px;font-size:17px;right:8px;}
  }

  @media (orientation:portrait){
    #inputBar{padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px);}
    #textField{height:40px;font-size:16px;padding:8px 12px;}
    #sendBtn{height:40px;padding:0 16px;font-size:14px;}
    #collapseBtn{width:36px;height:40px;font-size:17px;}
  }

  @media (max-width:375px) and (orientation:portrait){
    #inputBar{gap:4px;padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px);}
    #textField{height:36px;font-size:14px;padding:6px 8px;}
    #sendBtn{height:36px;padding:0 12px;font-size:12px;}
    #collapseBtn{width:30px;height:36px;font-size:15px;}
    #charCount{right:8px;bottom:6px;font-size:10px;}
    #inputToggle{width:40px;height:40px;right:6px;}
  }
  .win-card{cursor:pointer;border:2px solid #333;border-radius:10px;overflow:hidden;background:#1a1a1a;transition:border-color .15s;}
  .win-card:active{filter:brightness(1.3);}
  .win-card.current{border-color:#3a7;}
  .win-thumb{width:100%;aspect-ratio:16/10;background:#222;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .win-thumb-icon{width:100%;height:100%;object-fit:cover;}
  .win-thumb-emoji{font-size:32px;opacity:0.4;}
  .win-thumb-real{width:100%;height:100%;object-fit:cover;}
  .win-info{padding:6px 8px;}
  .win-title{color:#ddd;font:12px/1.3 system-ui;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .win-proc{color:#666;font:10px system-ui;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .desk-pill{padding:6px 12px;border:1px solid #444;border-radius:16px;background:#1a1a1a;color:#888;font:12px system-ui;cursor:pointer;white-space:nowrap;}
  .desk-pill.current{border-color:#3a7;color:#3a7;}
  .modal-open #pad{pointer-events:none;}
</style>
</head>
<body>
<div id="pad"></div>
<div id="hud"><span id="status">连接中…</span><span id="batteries"></span></div>
<div id="fingers">待机</div>
<div id="banner"><span class="dot"></span><span id="bannerText">连接已断开，正在重连…</span></div>
<button id="inputToggle" title="打开输入框">⌨</button>
<button id="winListToggle" title="窗口列表" aria-label="窗口列表">&#x229E;</button>
<div id="winListMode" style="display:none;position:fixed;inset:0;background:#0a0a0a;z-index:30;overflow-y:auto;">
  <div style="position:sticky;top:0;background:#0a0a0a;padding:12px 16px 8px;border-bottom:1px solid #333;display:flex;align-items:center;gap:10px;z-index:1;">
    <button id="winListBackBtn" style="background:none;color:#aaa;border:1px solid #444;border-radius:8px;padding:6px 12px;font:14px system-ui;cursor:pointer;">&#x2190; 返回</button>
    <span id="winListTitle" style="color:#888;font:13px system-ui;">选择窗口</span>
  </div>
  <div id="winGrid" style="padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;"></div>
</div>
<div id="inputBar" class="hidden">
  <div class="tf-wrap"><textarea id="textField" placeholder="输入文字…" rows="1"></textarea><span id="charCount">0</span></div>
  <button id="sendBtn">发送</button>
  <button id="collapseBtn" title="收起">⌄</button>
<script>
(function(){
  "use strict";
  var SENS = 6.7;           // 指针基准增益：手指px -> PC px（当前速度的 2/3）
  // 距离加速：慢移保持基准(精准)，快甩按移动距离额外加速，上限 ACCEL_MAX_MULT。
  var ACCEL_REF = 10;       // 每帧位移低于此值不加速(px/帧)
  var ACCEL_SLOPE = 10;     // 超过 ACCEL_REF 后，每多这么多 px/帧 加速 +1 倍
  var ACCEL_MAX_MULT = 2.0; // 最大加速倍数
  var MOVE_EMA = 0.25;      // 速度平滑系数(越小越平滑, 抑制颤动)
  var SCROLL_GAIN = 5.5;    // 滚动像素 -> 轮子单位（调高 = 更快、更跟手）
  var TAP_MS = 220, TAP_PX = 10;
  var SWIPE_PX = 45;        // 三/四指滑动触发距离（质心位移）
  var DIAG_MIN = 20;        // 判定斜向时，两个方向都需超过此位移
  var DIAG_RATIO = 1.6;     // 某方向超过另一方向 DIAG_RATIO 倍则视为正方向（非斜向）
  var SETTLE_MS = 120;      // 手指落下后等待稳定，再锁定指数量
  var COMMIT_EARLY_PX = 10; // 或位移超过此值立即锁定（更跟手）
  var ZOOM_STEP_PX = 20;    // 捏合每变化这么多 px 触发一档缩放（更灵敏）
  var ZOOM_DELTA = 100;     // 每档缩放强度（轮子单位）
  // 双指时区分"滚动"与"缩放"：累计两种信号，谁占优就锁定谁，避免滚动被误判成缩放。
  var DECIDE_PX = 20;       // 累计位移超过此值才判定手势类型（提高防抖）
  var PINCH_BIAS = 1.8;     // 缩放信号需明显强于滚动才会被判为捏合
  var LONGPRESS_MS = 400;   // 长按拖拽触发窗口拖拽的时长（ms）
  var isAndroid = /Android/i.test(navigator.userAgent);
  var MIN_GESTURE_FINGERS = isAndroid ? 4 : 3;
  var params = new URLSearchParams(location.search);
  var token = params.get('t') || '';

  var ws = null, authed = false, backoff = 500;
  var pad = document.getElementById('pad');
  var statusEl = document.getElementById('status');
  var fingersEl = document.getElementById('fingers');

  var banner = document.getElementById('banner');
  var bannerText = document.getElementById('bannerText');
  var winListToggle = document.getElementById('winListToggle');
  var winListMode = document.getElementById('winListMode');
  var winGrid = document.getElementById('winGrid');
  var winListBackBtn = document.getElementById('winListBackBtn');
  var winListActive = false;

  // Fire-and-forget device-side diagnostic: report the WebSocket close details
  // back to the server so it lands in ws_debug.log (useful for iOS Safari 1006).
  function reportClose(code, reason, clean){
    try {
      var q = 'code=' + encodeURIComponent(code) +
              '&reason=' + encodeURIComponent(reason || '') +
              '&clean=' + (clean ? 1 : 0) +
              '&ua=' + encodeURIComponent(navigator.userAgent || '');
      var img = new Image();
      img.src = '/report?' + q;
    } catch(_) {}
  }

  // pointerId -> {x,y,startX,startY,startT,moved}
  var pointers = new Map();
  // Smoothed speed estimate (EMA) used to drive pointer acceleration without
  // frame-to-frame gain jitter.
  var moveSpeedEma = 0;

  // rAF batching: accumulate sub-pixel deltas, flush once per frame.
  var pendingDx = 0, pendingDy = 0, rafPending = false;

  // Two-finger scroll smoothing (EMA).
  var scrollSmoothX = 0, scrollSmoothY = 0, SCROLL_EMA = 0.3;

  // Two-finger zoom continuous accumulator (sub-pixel).
  var zoomAccum = 0;

  // Live multi-touch gesture state. The finger COUNT is locked ("committed")
  // once the fingers have settled (or movement forces an early commit), so a
  // gesture is always interpreted under a single, stable finger count — this is
  // what makes 2/3/4-finger recognition accurate instead of flipping mid-gesture.
  var g = null;

  var stopReconnect = false;
var isConnecting = false;
  function showBanner(t){ bannerText.textContent = t; banner.classList.add('show'); }
  function hideBanner(){ banner.classList.remove('show'); }

  function connect(){
    if(ws && (ws.readyState === 0 || ws.readyState === 1)) return; // already connecting/open
    if(isConnecting) return;
    isConnecting = true;
    var proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.host + '/ws');
    if(!ws) { isConnecting = false; return; }

    ws.onopen = function(){ statusEl.textContent = '认证中…'; showBanner('握手成功·认证中…'); setTimeout(hideBanner, 1200); ws.send(JSON.stringify({t:'auth', token:token})); };
    ws.onmessage = function(e){
      var m; try { m = JSON.parse(e.data); } catch(_) { return; }
      if(m.t === 'status'){
        authed = true; stopReconnect = false; backoff = 500; statusEl.textContent = '已连接'; hideBanner();
        // Apply touch config from server if provided
        if(m.touch){
          var tc = m.touch;
          if(tc.gain !== undefined) SENS = tc.gain;
          if(tc.accel_ref !== undefined) ACCEL_REF = tc.accel_ref;
          if(tc.accel_slope !== undefined) ACCEL_SLOPE = tc.accel_slope;
          if(tc.accel_max_mult !== undefined) ACCEL_MAX_MULT = tc.accel_max_mult;
          if(tc.move_ema !== undefined) MOVE_EMA = tc.move_ema;
          if(tc.scroll_gain !== undefined) SCROLL_GAIN = tc.scroll_gain;
          if(tc.tap_ms !== undefined) TAP_MS = tc.tap_ms;
          if(tc.tap_px !== undefined) TAP_PX = tc.tap_px;
          if(tc.swipe_px !== undefined) SWIPE_PX = tc.swipe_px;
          if(tc.decide_px !== undefined) DECIDE_PX = tc.decide_px;
          if(tc.pinch_bias !== undefined) PINCH_BIAS = tc.pinch_bias;
          if(tc.diag_min !== undefined) DIAG_MIN = tc.diag_min;
          if(tc.diag_ratio !== undefined) DIAG_RATIO = tc.diag_ratio;
          if(tc.longpress_ms !== undefined) LONGPRESS_MS = tc.longpress_ms;
        }
        // Display PC battery if provided
        if(m.pc_battery) updateBatteryDisplay('pc', m.pc_battery);
        // Report phone battery to server
        reportPhoneBattery();
      }
      else if(m.t === 'reject'){ statusEl.textContent = '认证失败'; showBanner('认证失败' + (m.reason ? ' ('+m.reason+')' : '') + ' · 请重新扫码'); stopReconnect = true; try { ws.close(); } catch(_){} }
      else if(m.t === 'window_list'){ handleWindowList(m); }
      else if(m.t === 'thumb_update'){ handleThumbUpdate(m); }
      else if(m.t === 'switch_result'){ handleSwitchResult(m); }
      else if(m.t === 'win_event'){ handleWinEvent(m); }
    };

    ws.onclose = function(e){
      authed = false; statusEl.textContent = '断开，重连…'; isConnecting = false; isConnecting = false;
      if(winListActive) closeWinList();
      var code = e && e.code ? e.code : '?';
      var reason = e && e.reason ? e.reason : '';
      var clean = e && e.wasClean;
      reportClose(code, reason, clean);
      showBanner('连接已断开，正在重连… [code=' + code + ' ' + reason + ']');
      if(!stopReconnect) setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 8000);
    };
    ws.onerror = function(e){
      showBanner('WS错误 [code=' + (e && e.code ? e.code : '?') + ']');
      try { ws.close(); } catch(_){}
    };
  }

  function send(obj){ if(ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

  // Battery display
  var batteriesEl = document.getElementById('batteries');
  var pcBattery = null, phoneBattery = null;
  function updateBatteryDisplay(who, info){
    if(who === 'pc') pcBattery = info;
    else phoneBattery = info;
    renderBatteries();
  }
  function renderBatteries(){
    var html = '';
    if(pcBattery) html += batHtml('PC', pcBattery.percent, pcBattery.charging);
    if(phoneBattery) html += batHtml('📱', phoneBattery.level != null ? Math.round(phoneBattery.level*100) : '?', phoneBattery.charging);
    batteriesEl.innerHTML = html;
  }
  function batHtml(label, pct, charging){
    var color = pct <= 20 ? '#e44' : pct <= 50 ? '#ea4' : '#4a4';
    var fill = typeof pct === 'number' ? pct : 0;
    return '<span class="bat"><span class="bat-icon"><span class="bat-fill" style="width:'+fill+'%;background:'+color+'"></span></span><span class="bat-pct">'+label+' '+(typeof pct === 'number' ? pct+'%' : '?')+(charging ? '⚡' : '')+'</span></span>';
  }
  function reportPhoneBattery(){
    if(!navigator.getBattery) return;
    navigator.getBattery().then(function(bat){
      updateBatteryDisplay('phone', bat);
      bat.onlevelchange = function(){ updateBatteryDisplay('phone', bat); };
      bat.onchargingchange = function(){ updateBatteryDisplay('phone', bat); };
    });
  }

  // Long-press drag: 1 finger held still for LONGPRESS_MS → window drag mode
  function startLongpressTimer(){
    if(!g || g.longpressTimer) return;
    g.longpressTimer = setTimeout(function(){
      if(g && g.committedCount === 1 && !g.anyMoved && !g.longpressFired){
        g.longpressFired = true;
        if(authed) send({t:'gesture', g:'longpress_drag'});
        updateHud(1, '窗口拖拽');
        ripple(g.startC.x, g.startC.y);
      }
    }, LONGPRESS_MS);
  }
  function cancelLongpressTimer(){
    if(g && g.longpressTimer){ clearTimeout(g.longpressTimer); g.longpressTimer = null; }
  }

  // Drive one relative move from a single pointer delta. The acceleration gain is
  // derived from a *smoothed* speed (EMA of per-event magnitude) so it changes
  // gradually instead of jittering frame-to-frame (which read as "trembling").
  // Events are batched via rAF: sub-pixel deltas accumulate and flush once per
  // display frame, eliminating quantization jitter and halving WS traffic.
  function emitMove(dx, dy){
    if(!authed) return;
    pendingDx += dx;
    pendingDy += dy;
    if(!rafPending){
      rafPending = true;
      requestAnimationFrame(flushMove);
    }
  }

  function flushMove(){
    rafPending = false;
    var dx = pendingDx, dy = pendingDy;
    pendingDx = 0; pendingDy = 0;
    if(dx === 0 && dy === 0) return;
    var mag = Math.hypot(dx, dy);
    moveSpeedEma = moveSpeedEma * MOVE_EMA + mag * (1 - MOVE_EMA);
    var factor = moveSpeedEma <= ACCEL_REF ? 1 : 1 + (moveSpeedEma - ACCEL_REF) / ACCEL_SLOPE;
    if(factor > ACCEL_MAX_MULT) factor = ACCEL_MAX_MULT;
    var g = SENS * factor;
    send({t:'move', dx:Math.round(dx*g), dy:Math.round(dy*g)});
  }

  function ripple(x,y){
    var r = document.createElement('div'); r.className = 'ripple';
    r.style.left = x+'px'; r.style.top = y+'px';
    document.body.appendChild(r); setTimeout(function(){ r.remove(); }, 350);
  }

  function activePointers(){ var a = []; pointers.forEach(function(p){ a.push(p); }); return a; }
  function centroid(list){ var sx=0, sy=0; for(var i=0;i<list.length;i++){ sx+=list[i].x; sy+=list[i].y; } return {x:sx/list.length, y:sy/list.length}; }
  // Scale proxy for pinch: diagonal of the bounding box of all touches.
  // For 2 fingers this is exactly the distance between them.
  function pinchMetric(list){
    if(list.length < 2) return 0;
    var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
    for(var i=0;i<list.length;i++){
      var p = list[i];
      if(p.x<minx) minx=p.x; if(p.y<miny) miny=p.y;
      if(p.x>maxx) maxx=p.x; if(p.y>maxy) maxy=p.y;
    }
    return Math.hypot(maxx-minx, maxy-miny);
  }

   function labelFor(n){
    if(n===MIN_GESTURE_FINGERS) return isAndroid ? '四指导航' : '三指导航';
    if(n>=MIN_GESTURE_FINGERS+1) return isAndroid ? '五指桌面' : '四指桌面';
    return n + '指';
  }

  function updateHud(n, label){
    if(fingersEl) fingersEl.textContent = n + '指 · ' + label;
  }

  function newGesture(list){
    var c = centroid(list);
    moveSpeedEma = 0; // fresh speed estimate each gesture, no stale boost
    pendingDx = 0; pendingDy = 0; // flush any leftover move deltas
    scrollSmoothX = 0; scrollSmoothY = 0; // reset scroll smoothing
    zoomAccum = 0; // reset zoom accumulator
    g = {
      startT: performance.now(),
      settleUntil: performance.now() + SETTLE_MS,
      settleMove: 0,
      maxCount: list.length,
      committed: false,
      committedCount: list.length,
      startC: c, lastC: c,
      pinch0: pinchMetric(list),
      anyMoved: false,
      swipeFired: false,
      lastGesture: '',
      // 双指滚动/缩放消歧
      scrollAccum: 0,
      pinchAccum: 0,
      twoDecided: null,
      // 长按拖拽
      longpressTimer: null,
      longpressFired: false
    };
    updateHud(list.length, '…');
  }

  function commit(list){
    g.committed = true;
    g.committedCount = list.length;
    var c = centroid(list);
    g.startC = c; g.lastC = c; g.pinch0 = pinchMetric(list);
    g.scrollAccum = 0; g.pinchAccum = 0; g.twoDecided = null;
    scrollSmoothX = 0; scrollSmoothY = 0; zoomAccum = 0;
    updateHud(g.committedCount, labelFor(g.committedCount));
  }

  pad.addEventListener('pointerdown', function(e){
    pad.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY, startX:e.clientX, startY:e.clientY, startT:performance.now(), moved:false});
    var list = activePointers();
    if(!g){ newGesture(list); startLongpressTimer(); }
    else {
      // A new finger joined -> re-settle so the count is (re)locked correctly.
      g.maxCount = Math.max(g.maxCount, list.length);
      g.settleUntil = performance.now() + SETTLE_MS;
      g.settleMove = 0;
      g.committed = false;
      g.scrollAccum = 0; g.pinchAccum = 0; g.twoDecided = null;
      scrollSmoothX = 0; scrollSmoothY = 0; zoomAccum = 0;
      cancelLongpressTimer();
      updateHud(list.length, '…');
    }
    e.preventDefault();
  }, {passive:false});

  pad.addEventListener('pointermove', function(e){
    var p = pointers.get(e.pointerId); if(!p) return;
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if(Math.hypot(e.clientX - p.startX, e.clientY - p.startY) > TAP_PX) p.moved = true;
    if(p.moved){ g.anyMoved = true; cancelLongpressTimer(); }
    var list = activePointers();
    if(!g || list.length === 0) return;

    // Settling: wait until fingers are placed, unless movement forces an early commit.
    if(!g.committed){
      g.settleMove += Math.hypot(dx, dy);
      if(g.settleMove > COMMIT_EARLY_PX || performance.now() >= g.settleUntil){
        commit(list);
      } else {
        e.preventDefault(); return;
      }
    }

    if(g.committedCount === 1){
      // Defer until it's a drag (past the tap threshold); a pure tap teleports on
      // release instead. Once dragging, accumulate sub-pixel deltas and flush via
      // rAF (one send per display frame) — this eliminates quantization jitter
      // and halves WS traffic.
      if(authed && g.anyMoved){ emitMove(dx, dy); }
    } else if(g.committedCount === 2){
      var c = centroid(list);
      var sdx = c.x - g.lastC.x, sdy = c.y - g.lastC.y;
      var pd = pinchMetric(list);
      var dz = pd - g.pinch0;

      // Disambiguate scroll vs pinch: accumulate both signals, lock a mode once
      // enough motion has happened. Default stays "scroll" until a clear pinch
      // emerges, so ordinary two-finger scrolling is never hijacked by jitter.
      if(g.twoDecided !== 'scroll' && g.twoDecided !== 'pinch'){
        g.scrollAccum += Math.hypot(sdx, sdy);
        g.pinchAccum  += Math.abs(dz);
        if(g.scrollAccum + g.pinchAccum > DECIDE_PX){
          g.twoDecided = (g.pinchAccum > g.scrollAccum * PINCH_BIAS) ? 'pinch' : 'scroll';
          updateHud(2, g.twoDecided === 'pinch' ? '缩放' : '滚动');
        }
      }

      if(authed){
        if(g.twoDecided === 'pinch'){
          // Deliberate spread/contract -> zoom only (continuous interpolation).
          zoomAccum += dz;
          if(Math.abs(zoomAccum) >= ZOOM_STEP_PX){
            var steps = Math.trunc(zoomAccum / ZOOM_STEP_PX);
            zoomAccum -= steps * ZOOM_STEP_PX;
            send({t:'zoom', delta: steps * ZOOM_DELTA});
          }
        } else {
          // scroll / undecided -> scroll only (EMA-smoothed centroid deltas)
          // (baseline tracks live so a later genuine pinch still registers its
          // delta from the current spread).
          scrollSmoothX = scrollSmoothX * SCROLL_EMA + sdx * (1 - SCROLL_EMA);
          scrollSmoothY = scrollSmoothY * SCROLL_EMA + sdy * (1 - SCROLL_EMA);
          if(scrollSmoothX !== 0 || scrollSmoothY !== 0) send({t:'scroll', dx:Math.round(-scrollSmoothX*SCROLL_GAIN), dy:Math.round(-scrollSmoothY*SCROLL_GAIN)});
          g.pinch0 = pd;
        }
      }
      g.lastC = c;
    } else {
      // 3 or 4 fingers: classify a swipe once the centroid travels far enough.
      var c2 = centroid(list);
      var adx = c2.x - g.startC.x, ady = c2.y - g.startC.y;
      g.lastC = c2;
      if(!g.swipeFired && (Math.abs(adx) > SWIPE_PX || Math.abs(ady) > SWIPE_PX)){
        g.swipeFired = true;
        var ax = Math.abs(adx), ay = Math.abs(ady);
        // Diagonal when both axes travelled far and neither clearly dominates.
        var diag = ax > DIAG_MIN && ay > DIAG_MIN && ax < ay*DIAG_RATIO && ay < ax*DIAG_RATIO;
        var name;
        if(g.committedCount >= MIN_GESTURE_FINGERS){
          // 四指：窗口吸附（含四角吸附）
          if(diag){ name = (ady < 0 ? 'snap_up' : 'snap_down') + (adx < 0 ? '_l' : '_r'); }
          else if(ax >= ay){ name = adx < 0 ? 'snap_l' : 'snap_r'; }
          else { name = ady < 0 ? 'snap_up' : 'snap_down'; }
        } else {
          // 三指：导航 / 桌面管理（含四角斜向）
          if(diag){ name = (ady < 0 ? 'up' : 'down') + (adx < 0 ? '_l' : '_r'); }
          else if(ax >= ay){ name = adx < 0 ? 'desk_l' : 'desk_r'; }
          else { name = ady < 0 ? 'taskview' : 'showdesktop'; }
        }
        g.lastGesture = name;
        if(authed) send({t:'gesture', g:name});
        ripple(g.startC.x, g.startC.y);
        updateHud(g.committedCount, '手势: ' + name);
      }
    }
    e.preventDefault();
  }, {passive:false});

  function onUp(e){
    var p = pointers.get(e.pointerId); if(!p){ return; }
    pointers.delete(e.pointerId);
    var list = activePointers();

    if(g){
      cancelLongpressTimer();
      // End longpress drag if it was active
      if(g.longpressFired && authed){ send({t:'gesture', g:'longpress_end'}); }
      var count = g.committed ? g.committedCount : g.maxCount;
      var quick = (performance.now() - g.startT) < TAP_MS;
      // Tap = short, no real movement, no swipe fired, and all fingers lifted.
      if(!g.swipeFired && !g.anyMoved && quick && list.length === 0){
        if(count === 1 && authed){ send({t:'tap', b:'left'}); ripple(p.startX, p.startY); }
        else if(count === 2 && authed){ send({t:'tap', b:'right'}); ripple(p.startX, p.startY); }
        else if(count === MIN_GESTURE_FINGERS && authed){ send({t:'gesture', g:'taskview'}); }
        else if(count >= MIN_GESTURE_FINGERS + 1 && authed){ send({t:'gesture', g:'showdesktop'}); }
      }
      // Re-baseline a 2-finger scroll when a finger lifts, to avoid a jump.
      if(g.committedCount === 2 && list.length > 0){ g.lastC = centroid(list); scrollSmoothX = 0; scrollSmoothY = 0; zoomAccum = 0; }
      if(list.length === 0){ g = null; updateHud(0, '待机'); }
    }
    e.preventDefault();
  }
  pad.addEventListener('pointerup', onUp, {passive:false});
  pad.addEventListener('pointercancel', function(e){
    pointers.delete(e.pointerId);
    if(activePointers().length === 0){ g = null; updateHud(0, '待机'); }
  });

  // kill iOS pinch-zoom / double-tap zoom / context menu
  ['gesturestart','gesturechange','gestureend'].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); }, {passive:false});
  });
  pad.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});
  pad.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('dblclick', function(e){ e.preventDefault(); });

  // ─── voice / text input bar ─────────────────────────────────────────
  var inputToggle = document.getElementById('inputToggle');
  var inputBar = document.getElementById('inputBar');
  var textField = document.getElementById('textField');
  var sendBtn = document.getElementById('sendBtn');
  var collapseBtn = document.getElementById('collapseBtn');
  var charCount = document.getElementById('charCount');
  var inputMode = false;

  function closeInputBar(){
    inputMode = false;
    inputBar.classList.add('hidden');
    inputToggle.style.display = '';
  }

  inputToggle.addEventListener('click', function(){
    inputMode = !inputMode;
    inputBar.classList.toggle('hidden', !inputMode);
    inputToggle.style.display = inputMode ? 'none' : '';
    if(inputMode){
      textField.focus();
      updateCharCount();
    }
  });

  collapseBtn.addEventListener('click', closeInputBar);



  function updateCharCount(){
    var n = textField.value.length;
    charCount.textContent = n;
  }

  function sendText(){
    var text = textField.value.trim();
    if(text && authed){
      send({t:'key', text:text});
      textField.value = '';
      updateCharCount();
    }
  }
  sendBtn.addEventListener('click', sendText);
  textField.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendText(); }
  });
  textField.addEventListener('input', updateCharCount);


  // Reconnect immediately when the phone regains connectivity or returns to the page.
  window.addEventListener('online', function(){ if(!ws || ws.readyState === 3) connect(); });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && (!ws || ws.readyState === 3)) connect(); });

  updateHud(0, '待机');
  connect();

  // Register Service Worker for offline caching
  if('serviceWorker' in navigator){
    // ?v=3 busts the HTTP cache for sw.js itself so the browser actually
    // picks up the new v2 SW on the next page load. Without the bust, a
    // browser that has cached sw.js once will keep using the old copy even
    // after the server ships a fix.
    navigator.serviceWorker.register('/sw.js?v=3').catch(function(){});
  }
})();
  // -- window list ----------------------------------------------------
  var winListActive = false;
  var pendingSwitchHwnd = null;
  var pendingSwitchTimer = null;
  var SWITCH_TIMEOUT_MS = 5000;

  function openWinList(){
    winListActive = true;
    winListMode.style.display = 'block';
    winListToggle.style.display = 'none';
    inputToggle.style.display = 'none';
    pad.classList.add('modal-open');
    winListToggle.setAttribute('aria-expanded', 'true');
    winListMode.setAttribute('aria-hidden', 'false');
    send({t:'get_windows'});
    setTimeout(function(){ winListBackBtn.focus(); }, 50);
  }
  function closeWinList(){
    winListActive = false;
    winListMode.style.display = 'none';
    winListToggle.style.display = '';
    inputToggle.style.display = '';
    pad.classList.remove('modal-open');
    winListToggle.setAttribute('aria-expanded', 'false');
    winListMode.setAttribute('aria-hidden', 'true');
    if(pendingSwitchTimer){ clearTimeout(pendingSwitchTimer); pendingSwitchTimer = null; }
    pendingSwitchHwnd = null;
  }
  winListToggle.addEventListener('click', openWinList);
  winListBackBtn.addEventListener('click', closeWinList);
  winListMode.addEventListener('keydown', function(e){
    if(e.key !== 'Tab' || !winListActive) return;
    var focusable = winListMode.querySelectorAll('button:not([disabled]), [tabindex="0"]');
    if(focusable.length === 0) return;
    var first = focusable[0], last = focusable[focusable.length-1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  });

  function getWindowIcon(procName) {
    var lower = (procName || '').toLowerCase();
    if (lower.includes('chrome') || lower.includes('firefox') || lower.includes('msedge')) return '\u{1f310}';
    if (lower.includes('code') || lower.includes('idea') || lower.includes('sublime')) return '\u{1f4dd}';
    if (lower.includes('explorer') || lower.includes('dolphin') || lower.includes('nautilus')) return '\u{1f4c1}';
    if (lower.includes('terminal') || lower.includes('cmd') || lower.includes('powershell')) return '\u{1f5a5}';
    if (lower.includes('spotify') || lower.includes('music') || lower.includes('vlc')) return '\u{1f3b5}';
    if (lower.includes('slack') || lower.includes('discord') || lower.includes('teams')) return '\u{1f4ac}';
    return '\u{1f4bb}';
  }

  function renderWindowCard(w){
    var card = document.createElement('div');
    card.className = 'win-card' + (w.is_current ? ' current' : '');
    card.dataset.hwnd = w.hwnd;
    var thumb = document.createElement('div');
    thumb.className = 'win-thumb';
    if (w.icon) {
      var iconImg = document.createElement('img');
      iconImg.className = 'win-thumb-icon';
      iconImg.src = w.icon;
      iconImg.alt = w.process_name || '';
      thumb.appendChild(iconImg);
    } else {
      var emoji = document.createElement('span');
      emoji.className = 'win-thumb-emoji';
      emoji.textContent = getWindowIcon(w.process_name);
      thumb.appendChild(emoji);
    }
    card.appendChild(thumb);
    var info = document.createElement('div');
    info.className = 'win-info';
    var title = document.createElement('div');
    title.className = 'win-title';
    title.textContent = w.title || '(无标题)';
    info.appendChild(title);
    var proc = document.createElement('div');
    proc.className = 'win-proc';
    proc.textContent = w.process_name || '';
    info.appendChild(proc);
    card.appendChild(info);
    card.addEventListener('click', function(){
      if(w.is_current) return;
      if(pendingSwitchHwnd) return;
      pendingSwitchHwnd = w.hwnd;
      pendingSwitchTimer = setTimeout(function(){
        pendingSwitchHwnd = null; pendingSwitchTimer = null;
        winGrid.querySelectorAll('.win-card').forEach(function(c){ c.style.pointerEvents = ''; });
        showBanner('窗口切换超时');
      }, SWITCH_TIMEOUT_MS);
      winGrid.querySelectorAll('.win-card').forEach(function(c){ c.style.pointerEvents = 'none'; c.classList.remove('current'); });
      card.classList.add('current');
      send({t:'switch_window', hwnd:w.hwnd});
    });
    return card;
  }

  function renderDesktopBar(desktops){
    var bar = document.getElementById('winDesktopBar') || document.createElement('div');
    bar.id = 'winDesktopBar';
    bar.style.cssText = 'grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;padding:4px 0;';
    bar.innerHTML = '';
    desktops.forEach(function(d, i){
      var pill = document.createElement('button');
      pill.className = 'desk-pill' + (d.is_current ? ' current' : '');
      pill.textContent = d.name || ('桌面 ' + (i + 1));
      pill.addEventListener('click', function(){
        send({t:'switch_desktop', index:i});
        bar.querySelectorAll('.desk-pill').forEach(function(p){ p.classList.remove('current'); });
        pill.classList.add('current');
      });
      bar.appendChild(pill);
    });
    return bar;
  }

  var cardObserver = null;
  function setupCardObserver(){
    if(cardObserver) return;
    cardObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting && e.target.dataset.hwnd && !e.target.dataset.thumbPending){
          e.target.dataset.thumbPending = '1';
          send({t:'thumb_request', hwnd: Number(e.target.dataset.hwnd)});
        }
      });
    }, { root: winGrid, threshold: 0.3 });
  }

  function handleWindowList(m){
    var existingBar = document.getElementById('winDesktopBar');
    if(existingBar) existingBar.remove();
    if(m.desktops && m.desktops.length) winGrid.appendChild(renderDesktopBar(m.desktops));
    winGrid.innerHTML = '';
    setupCardObserver();
    (m.windows || []).forEach(function(w){
      var card = renderWindowCard(w);
      winGrid.appendChild(card);
      if(cardObserver) cardObserver.observe(card);
    });
  }

  function handleThumbUpdate(m){
    var card = winGrid.querySelector('[data-hwnd="'+m.hwnd+'"]');
    if(!card) return;
    var thumb = card.querySelector('.win-thumb');
    if(!thumb) return;
    if(typeof m.thumb === 'string' && m.thumb.indexOf('svg+xml') !== -1){
      delete card.dataset.thumbPending;
      return;
    }
    delete card.dataset.thumbPending;
    thumb.innerHTML = '';
    var img = document.createElement('img');
    img.src = m.thumb;
    img.className = 'win-thumb-real';
    img.alt = '';
    thumb.appendChild(img);
  }

  function handleWinEvent(m) {
    if(!winListActive) return;
    var evt = m.event || m.e;
    if(evt === 'foreground_changed' || evt === 'focus'){
      document.querySelectorAll('.win-card').forEach(function(c){ c.classList.remove('current'); });
      var c = winGrid.querySelector('[data-hwnd="'+m.hwnd+'"]');
      if(c) c.classList.add('current'); else send({t:'get_windows'});
    } else if(evt === 'created'){
      var card = renderWindowCard({hwnd:m.hwnd, title:m.title||'(无标题)', process_name:m.proc||'', is_current:false});
      card.style.opacity = '0';
      card.style.transform = 'scale(0.9)';
      winGrid.appendChild(card);
      requestAnimationFrame(function(){
        card.style.transition = 'opacity 0.2s, transform 0.2s';
        card.style.opacity = '1';
        card.style.transform = 'scale(1)';
      });
    } else if(evt === 'destroyed'){
      var c = winGrid.querySelector('[data-hwnd="'+m.hwnd+'"]');
      if(c){ c.style.transition='opacity 0.2s'; c.style.opacity='0'; setTimeout(function(){ c.remove(); }, 200); }
    } else if(evt === 'title_changed'){
      var c = winGrid.querySelector('[data-hwnd="'+m.hwnd+'"]');
      if(c){ var t = c.querySelector('.win-title'); if(t) t.textContent = m.title || '(无标题)'; }
    } else if(evt === 'desktop_changed'){
      send({t:'get_windows'});
    }
  }

  function handleSwitchResult(m){
    if(m.ok){
      if(pendingSwitchHwnd){
        winGrid.querySelectorAll('.win-card').forEach(function(c){ c.classList.remove('current'); c.style.pointerEvents = ''; });
        var card = winGrid.querySelector('[data-hwnd="'+pendingSwitchHwnd+'"]');
        if(card) card.classList.add('current');
      }
    } else {
      showBanner('窗口切换失败' + (m.error ? ': '+m.error : ''));
      winGrid.querySelectorAll('.win-card').forEach(function(c){ c.style.pointerEvents = ''; });
    }
    if(pendingSwitchTimer){ clearTimeout(pendingSwitchTimer); pendingSwitchTimer = null; }
    pendingSwitchHwnd = null;
  }


</script>
</body>
