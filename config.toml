[general]
start_hidden = false
log_path = ""

[scroll]
enabled = true
smooth = true
speed = 1.0
invert = false

[buttons]
enabled = true
window_switcher = true

# Shift+scroll → horizontal scroll
[[buttons.advanced]]
modifiers = { keyboard = 0x200 }
trigger = { type = "scroll" }
effect = { type = "modified_scroll", data = { modification = "horizontal" } }

# Ctrl+scroll → precision mode
[[buttons.advanced]]
modifiers = { keyboard = 0x100 }
trigger = { type = "scroll" }
effect = { type = "modified_scroll", data = { modification = "precision" } }

[drag]
enabled = true
button = "left"
mode = "move"

[accel]
enabled = true
sensitivity = 1000.0
min_factor = 1.0
max_factor = 2.0

[touch]
gain = 6.7
scroll_gain = 5.5
tap_ms = 220

[remote]
enabled = true
port = 18765
large_screen_split = true
split_ratio = 0.4
