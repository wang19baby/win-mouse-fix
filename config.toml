[general]
start_hidden = true
# Optional rolling log file. Uncomment to capture output when run headless.
log_path = "D:/work_space/personal_workspace/win-mouse-fix/win-mouse-fix.log"

[scroll]
enabled = true
smooth = true          # Smooth (inertial) scrolling vs raw wheel ticks
speed = 1.0           # Overall scroll speed multiplier
invert = false        # Invert vertical scroll direction

# ── Smooth-scroll tuning ────────────────────────────────────────────────────
# MMF 3.x drag-momentum model (v'(t) = -a·v(t)^b via curve.rs):
drag_exponent = 1.05   # Drag exponent `b`. Higher = shorter coast.
drag_coefficient = 15.0 # Drag coefficient `a`. Higher = faster decay.
stop_speed = 30.0     # units/sec; below this scrolling stops (inertia end)
step = 120            # Max wheel units per tick (subdivision cap for smoothness)
# Shift-to-accelerate: hold Shift to scroll faster (MMF-style).
shift_speedup = 1.0    # Speed multiplier when Shift is held; 1.0 = no change.
shift_horizontal = false # When true, Shift swaps vertical ↔ horizontal scroll.

# ── Tick interval clamping ─────────────────────────────────────────────────
# Ticks faster than tick_interval_min or slower than tick_interval_max
# are clamped to the boundary rather than rejected.
tick_interval_min = 0.001    # seconds; prevents acceleration overflow on fast wheels
tick_interval_max = 0.160    # seconds; gap > this starts a new swipe

# ── Acceleration curve ────────────────────────────────────────────────────
# Tick interval (seconds) at which the BezierAccelCurve saturates.
# Below this interval, the curve is in the pre-line (flat) region.
tick_interval_accel_end = 0.015
# BezierAccelCurve params: speed-in → multiplier-out curve (tick/s → px/tick).
# x_min/x_max: input range (tick/s); y_min/y_max: output range (px/tick multiplier).
# curvature: degree-1 of the bezier (higher = sharper saturation knee).
accel_x_min = 6.25     # tick/s; below this, no acceleration
accel_x_max = 66.667   # tick/s; above this, capped at y_max
accel_y_min = 30.0     # px/tick; minimum multiplier at x_min
accel_y_max = 120.0    # px/tick; maximum multiplier at x_max
accel_curvature = 3.0  # bezier degree-1; controls saturation shape

# ── Fast-scroll speedup ────────────────────────────────────────────────────
# Multi-burst swipe detection: after several quick swipe bursts, the
# multiplier ramps up to make long fast scrolls easier.
fast_scroll_threshold = 3
fast_scroll_initial = 1.33   # multiplier at first ramp step
fast_scroll_exponential = 7.5 # asymptotic multiplier ceiling
swipe_max_interval = 0.375   # seconds; gap > this resets the swipe sequence
swipe_min_tick_speed = 16.0   # tick/s; below this, fast-scroll is skipped
swipe_threshold_ticks = 2    # ticks in a burst before counting toward fast-scroll
swipe_max_ticks = 11          # max ticks per burst counted toward fast-scroll ramp

# ── Base phase timing ──────────────────────────────────────────────────────
# Duration of the base (gesture-driven) phase per wheel tick in milliseconds.
# -1 means use the curve-derived duration; set a fixed value to override.
base_ms_per_step = -1.0

# ── Advanced: time & velocity smoothing ──────────────────────────────────
# Exponential smoothing weight for time-between-ticks (WheelTracker).
# Higher = more responsive/jittery; lower = smoother/more lag.
# MMF default ~0.5.
time_smoothing_weight = 0.5

# Double-exponential smoother params for implied velocity.
# Set both to 1.0 to disable velocity smoothing.
# Lower values make the scroll speed react more sluggishly to changes.
velocity_a = 1.0     # Data weight `a`. 1.0 = off, lower = smoother.
velocity_y = 1.0     # Trend weight `y`. 1.0 = off, lower = smoother.

[buttons]
enabled = false

# ── Legacy button remaps ───────────────────────────────────────────────────────
# Simple source → target remapping. The source button event is consumed and
# the target action is synthesized instead.
# [[buttons.remaps]]
# source = "right"          # Source button: left, right, middle, x1, x2
# action = "button"         # Action type: "button", "key", or "disabled"
# target = "left"           # Target button (for action = "button")
# vk = 0x23                # Virtual key code (for action = "key")

# ── Advanced button remaps ────────────────────────────────────────────────────
# Trigger + Effect remapping with modifier support. The ClickCycleTracker
# tracks click counts (1-click, 2-click, 3-click) and hold duration.
# A "hold" action fires on button down; "click" fires on button up.
#
# Modifier flags (keyboard):  0x100 = Ctrl, 0x200 = Shift, 0x400 = Alt, 0x800 = Cmd
# Modifier flags (buttons):   right = "button held as modifier" (use advanced.buttons)
#
# Example: Right-click single-click → Alt+Tab
# [[buttons.advanced]]
# trigger = { type = "button", button = "right", level = 1, duration = "click" }
# effect = { type = "symbolic_hotkey", keycode = 0x23, flags = 0x800 }
#
# Example: Right-click double-click → forward navigation (Alt+→)
# [[buttons.advanced]]
# trigger = { type = "button", button = "right", level = 2, duration = "click" }
# effect = { type = "navigation_swipe", direction = "forward" }
#
# Example: Right-click held → Ctrl (right-click acts as a modifier while held)
# [[buttons.advanced]]
# trigger = { type = "button", button = "right", level = 1, duration = "hold" }
# effect = { type = "symbolic_hotkey", keycode = 0x11, flags = 0x100 }  # Ctrl
#
# Example: Ctrl+scroll → precision mode (cursor movement instead of scroll)
# [[buttons.advanced]]
# modifiers = { keyboard = 0x100 }  # Ctrl held
# trigger = { type = "scroll" }
# effect = { type = "modified_scroll", modification = "precision" }
#
# Example: Shift+scroll → horizontal scroll
# [[buttons.advanced]]
# modifiers = { keyboard = 0x200 }  # Shift held
# trigger = { type = "scroll" }
# effect = { type = "modified_scroll", modification = "horizontal" }
#
# Example: Three-finger swipe drag
# [[buttons.advanced]]
# trigger = { type = "drag" }
# effect = { type = "modified_drag", drag_type = "three_finger_swipe" }

